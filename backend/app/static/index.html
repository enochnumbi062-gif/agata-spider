<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>AgAtA-SpiDeR — Security Command</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="stage">
  <header class="hud top">
    <div><div class="brand">AgAtA-SpiDeR</div><div class="sub">Centre de commande zero-trust</div></div>
    <div class="pills"><span class="pill">API<b id="apiState">—</b></span><span class="pill">Mode<b id="mode">—</b></span><span class="pill">Session<b id="auth">non</b></span></div>
  </header>
  <aside class="hud stats" aria-label="Indicateurs">
    <div class="metric"><strong id="assetCount">—</strong><small>Actifs</small></div>
    <div class="metric"><strong id="riskCount">—</strong><small>Constats</small></div>
    <div class="metric"><strong id="policy">—</strong><small>Politique</small></div>
    <div class="metric"><strong id="fps">—</strong><small>Images/s</small></div>
  </aside>
  <section class="hud log" aria-label="Journal"><h2>Journal</h2><div id="feed" aria-live="polite"></div></section>
  <nav class="hud dock" aria-label="Modules"><h2>Modules</h2><div id="menu"></div></nav>
  <section class="hud detail" id="detail" aria-label="Module sélectionné">
    <header><h2 id="dTitle"></h2><span id="dBadge" class="badge"></span><button id="min" class="ico" type="button" aria-label="Réduire ou agrandir">–</button></header>
    <p id="dDesc" class="mut"></p>
    <div id="dBody"></div>
  </section>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
